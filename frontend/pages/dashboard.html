<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard — Synapse</title>
    <link rel="stylesheet" href="/css/global.css?v=4">
    <link rel="stylesheet" href="/css/dashboard.css?v=4">
</head>
<body data-page="dashboard">
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <a href="/pages/dashboard.html" class="brand" style="text-decoration: none; display: flex; align-items: center; gap: var(--space-2);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <span class="gradient-text font-bold">Synapse</span>
            </a>
            <nav>
                <a class="active" href="/pages/dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Dashboard
                </a>
                <a href="/pages/kanban.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Projects
                </a>
                <a href="/pages/analytics.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    Analytics
                </a>
                <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border);">
                    <a href="/pages/profile.html">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        Profile
                    </a>
                    <a href="#" id="logout" style="color: var(--danger);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Logout
                    </a>
                </div>
            </nav>
        </div>
    </aside>

    <main class="content-wrapper">
        <header class="topbar">
            <div class="flex items-center gap-4">
                <button class="btn btn-ghost mobile-nav-toggle" id="menuToggle" style="padding: 4px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h2 id="greeting" class="text-lg" style="flex-shrink: 0;">Dashboard</h2>
            </div>
            <div class="flex items-center gap-4" style="flex: 1; justify-content: flex-end;">
                <div class="search-container" style="max-width: 400px; width: 100%; position:relative;">
                    <input type="text" class="input" id="globalSearch" placeholder="Search projects..." style="padding-left: 36px;">
                    <svg style="position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.4;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <div id="searchResults" class="card" style="display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:100; max-height:400px; overflow-y:auto; padding:8px; box-shadow: var(--shadow-md);"></div>
                </div>
                <button class="btn" id="aiProject" style="color: var(--accent); border-color: var(--accent);">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    AI Setup
                </button>
                <button class="btn btn-primary" id="newProject">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Project
                </button>
            </div>
        </header>

        <div class="dashboard-main-grid">
            <div class="main-content">
                <section class="grid cols-4" id="stats"></section>
                
                <section class="mt-8">
                    <div class="section-header flex items-center justify-between">
                        <h3>Your Projects</h3>
                    </div>
                    <div class="grid cols-3" id="projectGrid"></div>
                </section>
            </div>

            <aside class="activity-pane">
                <div class="card" style="padding: 20px; height: calc(100vh - 120px); position: sticky; top: 24px; display: flex; flex-direction: column;">
                    <h3 style="font-size: 14px; margin-bottom: 20px; color: var(--text);">Activity Feed</h3>
                    <div id="activityList" class="activity-list" style="flex: 1; overflow-y: auto;">
                        <div class="text-muted text-sm" style="text-align: center; padding: 40px 0;">No recent activity</div>
                    </div>
                </div>
            </aside>
        </div>
    </main>
</div>

<script src="/js/utils.js?v=2"></script>
<script src="/js/api.js?v=2"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/websocket.js?v=2"></script>
<script src="/js/notifications.js?v=2"></script>
<script src="/js/modal.js?v=2"></script>
<script src="/js/ai-generator.js?v=2"></script>
<script src="/js/app.js?v=2"></script>

<script>
document.getElementById("logout").addEventListener("click", (e) => { e.preventDefault(); Auth.logout(); });

document.getElementById("newProject").addEventListener("click", () => {
    const back = Modal.openModal(`
        <div style="padding: 8px;">
            <h2 style="font-size: 18px;">Create Project</h2>
            <p class="text-dim text-sm mt-2">Start a new workspace for your team.</p>
            <form id="pf" style="display:grid; gap:16px; margin-top:24px;">
                <div style="display:grid; gap:8px;">
                    <label class="text-xs font-medium text-dim">Project Name</label>
                    <input class="input" name="name" placeholder="Acme Dashboard" required />
                </div>
                <div style="display:grid; gap:8px;">
                    <label class="text-xs font-medium text-dim">Description</label>
                    <textarea class="input" name="description" placeholder="Short description of the project" rows="3"></textarea>
                </div>
                <div style="display:grid; gap:8px;">
                    <label class="text-xs font-medium text-dim">Color Theme</label>
                    <input class="input" name="color" type="color" value="#3b82f6" style="height: 40px; padding: 4px;" />
                </div>
                <div class="flex gap-2 justify-end mt-4">
                    <button class="btn" type="button" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
                    <button class="btn btn-primary" type="submit">Create Project</button>
                </div>
            </form>
        </div>
    `);
    
    back.querySelector("#pf").addEventListener("submit", async (e) => {
        e.preventDefault(); 
        const f = e.target;
        const btn = f.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = "Creating...";
        
        try {
            const slug = f.name.value.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,"") + "-" + Date.now().toString(36);
            await API.api("/projects/", { method: "POST", body: {
                name: f.name.value, slug, description: f.description.value, color: f.color.value }});
            U.toast("Project created", "success"); 
            back.remove(); 
            location.reload();
        } catch (err) { 
            U.toast(err.message, "error"); 
            btn.disabled = false;
            btn.textContent = "Create Project";
        }
    });
});

document.getElementById("aiProject").addEventListener("click", () => {
    const back = Modal.openModal(`
        <div style="padding: 8px;">
            <div class="flex items-center gap-3">
                <div style="background: var(--bg-surface-hover); padding: 8px; border-radius: 8px; color: var(--accent);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
                <div>
                    <h2 style="font-size: 18px;">AI Project Setup</h2>
                    <p class="text-dim text-sm">Describe your idea, and we'll generate the milestones.</p>
                </div>
            </div>
            <form id="aiPf" style="display:grid; gap:16px; margin-top:24px;">
                <textarea class="input" name="idea" placeholder="e.g. Build a healthcare booking app..." rows="4" required></textarea>
                <div class="flex gap-2 justify-end mt-4">
                    <button class="btn" type="button" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
                    <button class="btn btn-primary" style="background: var(--accent); border-color: var(--accent);" type="submit" id="aiBtn">Generate Workspace</button>
                </div>
            </form>
        </div>
    `);
    
    back.querySelector("#aiPf").addEventListener("submit", async (e) => {
        e.preventDefault(); 
        const btn = back.querySelector("#aiBtn");
        const originalText = btn.textContent;
        btn.textContent = "AI is thinking...";
        btn.disabled = true;
        
        try {
            const idea = e.target.idea.value;
            const res = await window.AI.aiPlanProject(idea);
            const slug = "ai-" + Date.now().toString(36);
            const proj = await API.api("/projects/", { method: "POST", body: {
                name: "AI: " + idea.slice(0, 30) + "...", slug, description: "Generated from idea: " + idea, color: "#3b82f6" }});
            
            if(res.data && res.data.milestones) {
                for(const m of res.data.milestones) {
                    for(const t of m.tasks) {
                        await API.api("/tasks/", { method: "POST", body: {
                            project: proj.id, title: `[${m.name}] ${t.title}`, priority: t.priority || "medium"
                        }});
                    }
                }
            }
            U.toast("AI Project Setup Complete!", "success");
            location.href = `/pages/kanban.html?project=${proj.id}`;
        } catch (err) { 
            U.toast(err.message, "error"); 
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
});
</script>
</body>
</html>
