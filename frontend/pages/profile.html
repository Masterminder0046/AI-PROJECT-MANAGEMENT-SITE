<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile — Synapse</title>
    <link rel="stylesheet" href="/css/global.css?v=4">
    <link rel="stylesheet" href="/css/dashboard.css?v=4">
</head>
<body data-page="profile">
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <a href="/pages/dashboard.html" class="brand" style="text-decoration: none; display: flex; align-items: center; gap: var(--space-2);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <span class="gradient-text font-bold">Synapse</span>
            </a>
            <nav>
                <a href="/pages/dashboard.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Dashboard
                </a>
                <a class="active" href="/pages/profile.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profile
                </a>
                <a href="/pages/settings.html">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Settings
                </a>
            </nav>
        </div>
    </aside>

    <main class="content-wrapper">
        <header class="topbar">
            <div class="flex items-center gap-4">
                <button class="btn btn-ghost mobile-nav-toggle" id="menuToggle" style="padding: 4px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h2 class="text-lg">Profile Settings</h2>
            </div>
        </header>

        <div style="padding: var(--space-6); max-width: 800px; margin: 0 auto; width: 100%;">
            <div id="profileBox" class="slide-up">
                <div class="card" style="padding: var(--space-8);">
                    <div style="text-align: center; margin-bottom: var(--space-8);">
                        <div id="avatarDisplay" style="width: 80px; height: 80px; border-radius: 50%; background: var(--bg-surface-strong); margin: 0 auto var(--space-4); display: flex; align-items: center; justify-content: center; font-size: 2rem; border: 2px solid var(--border);">
                            ?
                        </div>
                        <input type="file" id="avatarInput" style="display:none" accept="image/*" />
                        <button class="btn btn-ghost text-sm" onclick="document.getElementById('avatarInput').click()">Change Photo</button>
                    </div>

                    <form id="pf" style="display:grid; gap:var(--space-6);">
                        <div class="grid cols-2">
                            <div style="display:grid; gap:var(--space-2);">
                                <label class="text-xs font-medium text-dim uppercase">First Name</label>
                                <input class="input" name="first_name" required />
                            </div>
                            <div style="display:grid; gap:var(--space-2);">
                                <label class="text-xs font-medium text-dim uppercase">Last Name</label>
                                <input class="input" name="last_name" required />
                            </div>
                        </div>
                        <div style="display:grid; gap:var(--space-2);">
                            <label class="text-xs font-medium text-dim uppercase">Bio</label>
                            <textarea class="input" name="bio" rows="3" style="height: auto; padding: 12px;"></textarea>
                        </div>
                        <div class="flex justify-end">
                            <button class="btn btn-primary" type="submit">Save Changes</button>
                        </div>
                    </form>
                </div>

                <div class="card mt-8" style="padding: var(--space-8);">
                    <h3 class="mb-6">Security</h3>
                    <form id="pwf" style="display:grid; gap:var(--space-6);">
                        <div style="display:grid; gap:var(--space-2);">
                            <label class="text-xs font-medium text-dim uppercase">Current Password</label>
                            <input type="password" class="input" name="old_password" required />
                        </div>
                        <div style="display:grid; gap:var(--space-2);">
                            <label class="text-xs font-medium text-dim uppercase">New Password</label>
                            <input type="password" class="input" name="new_password" required />
                        </div>
                        <div class="flex justify-end">
                            <button class="btn">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/utils.js?v=3"></script>
<script src="/js/api.js?v=3"></script>
<script src="/js/auth.js?v=3"></script>
<script src="/js/websocket.js?v=3"></script>
<script src="/js/notifications.js?v=3"></script>
<script src="/js/app.js?v=3"></script>

<script>
(async () => {
    const me = await API.api("/auth/me/");
    const f = document.getElementById("pf");
    f.first_name.value = me.first_name || "";
    f.last_name.value = me.last_name || "";
    f.bio.value = me.bio || "";
    
    const av = document.getElementById("avatarDisplay");
    if (me.avatar) {
        av.innerHTML = `<img src="${me.avatar}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
    } else {
        av.textContent = (me.first_name || me.email)[0].toUpperCase();
    }

    f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = f.querySelector('button[type="submit"]');
        btn.disabled = true;
        try {
            await API.api("/auth/me/", { method: "PATCH", body: {
                first_name: f.first_name.value,
                last_name: f.last_name.value,
                bio: f.bio.value 
            }});
            U.toast("Profile updated", "success");
        } catch (err) { U.toast(err.message, "error"); }
        btn.disabled = false;
    });

    document.getElementById("avatarInput").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const fd = new FormData();
        fd.append("avatar", file);
        try {
            U.toast("Uploading...", "info");
            const res = await fetch("/api/v1/auth/me/", {
                method: "PATCH",
                headers: { "Authorization": "Bearer " + API.getAccess() },
                body: fd
            });
            if(!res.ok) throw new Error("Upload failed");
            U.toast("Avatar updated!", "success");
            setTimeout(() => location.reload(), 1000);
        } catch(err) { U.toast(err.message, "error"); }
    });

    document.getElementById("pwf").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Updating...";
        try {
            await API.api("/auth/password/change/", { method: "POST", body: {
                old_password: e.target.old_password.value,
                new_password1: e.target.new_password.value,
                new_password2: e.target.new_password.value 
            }});
            U.toast("Password updated successfully", "success");
            e.target.reset();
        } catch (err) { U.toast(err.message, "error"); }
        btn.disabled = false;
        btn.textContent = originalText;
    });
})();
</script>
</body>
</html>
