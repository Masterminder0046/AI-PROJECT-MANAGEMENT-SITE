<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Project Settings — Synapse</title>
    <link rel="stylesheet" href="/css/global.css?v=2">
    <link rel="stylesheet" href="/css/dashboard.css?v=2">
</head>
<body data-page="project-details">
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            <span class="gradient-text">Synapse</span>
        </div>
        <nav>
            <a href="/pages/dashboard.html">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Dashboard
            </a>
            <a href="/pages/kanban.html">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Projects
            </a>
            <a href="/pages/analytics.html">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                Analytics
            </a>
        </nav>
    </aside>

    <main class="content-wrapper" style="flex:1; overflow-y:auto;">
        <header class="topbar">
            <div class="flex items-center gap-4">
                <a href="/pages/dashboard.html" class="btn btn-ghost" style="padding: 4px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <h2 id="pTitle">Project Settings</h2>
            </div>
        </header>

        <div class="main" style="padding: 24px; max-width: 800px;">
            <div id="pBody">
                <div class="flex items-center justify-center" style="height: 200px;">
                    <div class="text-dim">Loading project details...</div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/utils.js?v=2"></script>
<script src="/js/api.js?v=2"></script>
<script src="/js/auth.js?v=2"></script>
<script src="/js/websocket.js?v=2"></script>
<script src="/js/notifications.js?v=2"></script>
<script src="/js/ai-generator.js?v=2"></script>
<script src="/js/app.js?v=2"></script>

<script>
(async () => {
  const id = +new URLSearchParams(location.search).get("id");
  if (!id) {
      location.href = "/pages/dashboard.html";
      return;
  }
  
  try {
    const p = await API.api(`/projects/${id}/`);
    document.getElementById("pTitle").textContent = p.name;
    document.getElementById("pBody").innerHTML = `
        <div class="card" style="padding: 32px;">
            <form id="editProjectForm" style="display:grid; gap:24px;">
                <div style="display:grid; gap:8px;">
                    <label class="text-xs font-medium text-dim uppercase tracking-wider">Project Name</label>
                    <input class="input" name="name" value="${U.escapeHtml(p.name)}" required />
                </div>
                
                <div style="display:grid; gap:8px;">
                    <label class="text-xs font-medium text-dim uppercase tracking-wider">Description</label>
                    <textarea class="input" name="description" rows="4" placeholder="What is this project about?">${U.escapeHtml(p.description||'')}</textarea>
                </div>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
                    <div style="display:grid; gap:8px;">
                        <label class="text-xs font-medium text-dim uppercase tracking-wider">Theme Color</label>
                        <div class="flex gap-3 items-center">
                            <input type="color" name="color" value="${p.color || '#3b82f6'}" style="width:40px; height:40px; padding:0; border:none; background:none; cursor:pointer;" />
                            <span class="text-sm font-mono text-dim">${p.color || '#3b82f6'}</span>
                        </div>
                    </div>
                    <div style="display:grid; gap:8px;">
                        <label class="text-xs font-medium text-dim uppercase tracking-wider">Status</label>
                        <select class="input" name="status">
                            <option value="active" ${p.status==='active'?'selected':''}>Active</option>
                            <option value="archived" ${p.status==='archived'?'selected':''}>Archived</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-3 pt-6 border-t" style="border-color: var(--border);">
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                    <a class="btn" href="/pages/kanban.html?project=${p.id}">Open Board</a>
                    <button class="btn" type="button" id="delProjectBtn" style="margin-left:auto; color:var(--danger); border-color:var(--danger); background:rgba(239, 68, 68, 0.05);">Delete Project</button>
                </div>
            </form>
        </div>

        <div class="card mt-8" style="padding: 32px; border-color: var(--accent); background: rgba(59, 130, 246, 0.02);">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h3 class="flex items-center gap-2">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        AI Project Insights
                    </h3>
                    <p class="text-dim text-sm mt-1">Get an automated health check and suggestions for your project.</p>
                </div>
                <button class="btn" id="aiHealthBtn" style="border-color:var(--accent); color:var(--accent)">Analyze Project</button>
            </div>
            
            <div id="aiHealthBox" class="card" style="padding:24px; display:none; background: var(--bg-app);">
                <div id="aiHealthContent" class="text-sm" style="line-height:1.6">AI is analyzing your project...</div>
            </div>
        </div>
    `;

    document.getElementById("editProjectForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = "Saving...";
        try {
            const f = e.target;
            await API.api(`/projects/${id}/`, { method: "PATCH", body: {
                name: f.name.value, description: f.description.value, color: f.color.value, status: f.status.value
            }});
            U.toast("Project updated!", "success");
        } catch (err) { U.toast(err.message, "error"); }
        finally {
            btn.disabled = false;
            btn.textContent = "Save Changes";
        }
    });

    document.getElementById("delProjectBtn").addEventListener("click", async () => {
        if (!confirm("Are you sure you want to delete this project? This cannot be undone.")) return;
        try {
            await API.api(`/projects/${id}/`, { method: "DELETE" });
            U.toast("Project deleted", "success");
            setTimeout(() => location.href = "/pages/dashboard.html", 1000);
        } catch (err) { U.toast(err.message, "error"); }
    });

    document.getElementById("aiHealthBtn").addEventListener("click", async (e) => {
        const btn = e.target;
        const box = document.getElementById("aiHealthBox");
        const content = document.getElementById("aiHealthContent");
        
        btn.textContent = "Analyzing...";
        btn.disabled = true;
        box.style.display = "block";
        content.innerHTML = `<div class="flex items-center gap-3"><div class="loading-spinner"></div> AI is thinking...</div>`;
        
        try {
            const tasks = await API.api(`/tasks/?project=${id}&page_size=100`);
            const res = await window.AI.aiGetProjectHealth(id, p.name, tasks.results || tasks);
            
            if (res.data && res.data.suggestions) {
                content.innerHTML = `<ul style="display:grid; gap:20px; list-style:none; padding:0;">
                    ${res.data.suggestions.map(s => `
                        <li style="padding-left:16px; border-left:2px solid var(--accent);">
                            <div class="font-bold text-sm mb-1">${s.title} <span class="text-xs px-2 py-0.5 rounded-full ml-2" style="background:rgba(59, 130, 246, 0.1); color:var(--accent); border:1px solid rgba(59, 130, 246, 0.2)">Impact: ${s.impact}</span></div>
                            <div class="text-dim text-xs">${s.why}</div>
                        </li>
                    `).join('')}
                </ul>`;
            } else {
                content.textContent = "AI couldn't generate a report right now. Try adding more tasks first!";
            }
        } catch (err) {
            U.toast(err.message, "error");
            box.style.display = "none";
        } finally {
            btn.textContent = "Analyze Project";
            btn.disabled = false;
        }
    });
  } catch (err) {
    document.getElementById("pBody").innerHTML = `
        <div class="card" style="padding:40px; text-align:center; border-color:var(--danger);">
            <div class="text-danger font-bold text-lg mb-2">Access Denied</div>
            <p class="text-dim mb-6">${err.message === 'Forbidden' ? 'You do not have permission to view this project.' : err.message}</p>
            <a href="/pages/dashboard.html" class="btn btn-primary">Back to Dashboard</a>
        </div>`;
  }
})();
</script>
</body>
</html>
